<footer>
  <div class="container mt-3 mb-4">
    <section>
    <div class="row">
      <div class="col-md-7">
        <small class="text-muted">Made in 🇨🇭 by {{ site.Params.author }}</small>
      </div>
      <div class="col-md-5">
        <div class="row">
          {{- range where hugo.Data.sharing.socialnetworks "footer" true }}
          <div class="col">
            <small><a href="{{ .url }}" class="text-decoration-none">{{ .name }}</a></small>
          </div>
          {{- end }}
        </div>
      </div>
    </div>
    </section>
  </div>
</footer>
