{{- /* Video series cards from data/hobbies/series.json. */ -}}
<div class="row gx-4">
  {{- range hugo.Data.hobbies.series }}
  <div class="col">
    <div class="card mb-2">
      <img src="{{ .image | relURL }}" class="card-img-top" alt="{{ .alt }}">
      <div class="card-body">
        <h5 class="card-title">{{ .title }}</h5>
        <p class="card-text">{{ .text }}</p>
      </div>
      <ul class="list-group list-group-flush">
        {{- range .stats }}
        <li class="list-group-item">{{ . }}</li>
        {{- end }}
      </ul>
      <div class="card-body">
        <a href="{{ .url }}" class="btn btn-danger stretched-link" target="_blank" rel="noopener">Watch on YouTube</a>
      </div>
    </div>
  </div>
  {{- end }}
</div>
