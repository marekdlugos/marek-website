<!DOCTYPE html>
<html lang="en">
{{- partial "head.html" . -}}

<body>
    <header>
        <div class="container">
            {{- partial "header.html" . -}}
        </div>
    </header>
    <main class="mt-5">
        <div class="container gx-md-3 gx-sm-2">
            {{- block "main" . }}{{- end }}
        </div>
    </main>
    <footer>
        <div class="container mt-3 mb-4">
            {{- partial "footer.html" . -}}
        </div>
    </footer>

    <div class="fixed-bottom">
        <div class="progress-container">
            <div class="progress-bar" id="myBar"></div>
        </div>
    </div>

    {{ $js := resources.Get "js/bootstrap.bundle.min.js" | resources.Copy "js/bundle.js" }}
    <script src="{{ $js.RelPermalink }}" defer></script>

</body>

</html>
