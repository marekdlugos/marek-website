<!DOCTYPE html>
<html lang="en">
{{- partial "head.html" . -}}

<body>
    <a class="visually-hidden-focusable" href="#main">Skip to main content</a>
    {{- partial "header.html" . -}}
    <main id="main" class="mt-5">
        <div class="container gx-md-3 gx-sm-2">
            {{- block "main" . }}{{- end }}
        </div>
    </main>
    {{- partial "footer.html" . -}}

    <div class="fixed-bottom">
        <div class="progress-container">
            <div class="progress-bar" id="myBar"></div>
        </div>
    </div>

    {{ $js := resources.Get "js/bootstrap.bundle.min.js" | resources.Copy "js/bundle.js" }}
    <script src="{{ $js.RelPermalink }}" defer></script>

</body>

</html>
