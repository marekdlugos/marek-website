{{- /* components/status-pill.html
  Props:
  label  string, required
  dot    bool, optional: green availability dot
*/}}
<span
  class="inline-flex items-center gap-2 rounded-pill border border-hairline px-4 py-2 text-sm font-medium text-ink"
>
  {{ if .dot }}
    <span class="size-2 rounded-pill bg-positive" aria-hidden="true"></span>
  {{ end }}
  {{ .label }}
</span>
