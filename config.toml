baseURL = "https://www.marekdlugos.com/"
locale = "en-us"
title = "Marek Dlugos — Revenue Growth, Product, Design, Software Engineering."
relativeURLS = true
publishDir = "docs"
disableHugoGeneratorInject = true
SectionPagesMenu = "main"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    target = "assets/js/bootstrap.bundle.min.js"

[minify]
  minifyOutput = true

[taxonomies]
  tag = "tags"
  category = "categories"

# Allow .html files in content/ (Hugo 0.163+ blocks text/html content by default).
# This site's pages are authored as raw HTML, so we re-enable it.
[security]
  allowContent = ['.']