baseURL = "https://www.marekdlugos.com/"
# `locale` is Hugo's language key; `languageCode` was deprecated in v0.158.
# Read it in templates via site.Language.Locale.
locale = "en-US"
title = "Marek Dlugos — Revenue Growth, Product, Design, Software Engineering."
relativeURLs = true
disableHugoGeneratorInject = true
sectionPagesMenu = "main"

# The design system is a Hugo theme that lives in this repo (themes/marek-ds).
# Site templates in layouts/ override theme templates of the same name.
theme = "marek-ds"

# Tags and categories are never surfaced in the UI, and the generated term
# pages would render through the blog list template (blog intro prose and all).
# Post front matter keeps its tags/categories, so this is a one-line revert.
disableKinds = ["taxonomy", "term"]

# Site-wide values consumed by layouts. Nothing user-facing should be
# hardcoded in a template when it belongs here.
[params]
  author = "Marek Dlugos"
  email = "hi@marekdlugos.com"
  description = "B2B SaaS consultant specializing in product, retention, and revenue growth. Aligning design, engineering, and sales into one execution engine."
  jobTitle = "AI Solutions & Revenue Growth Consultant"
  knowsAbout = ["B2B SaaS", "AI agents", "business process automation", "revenue growth", "product management", "customer success"]
  clearbitKey = "pk_4494011d9a7d418f46e138cdcbff45fa"
  # Fallback og:image, resolved against baseURL by the embedded opengraph
  # template. A page can override it with `images:` in its front matter.
  images = ["marek-dlugos.webp"]

  [params.worksFor]
    name = "Duvo"
    url = "https://duvo.com"

  [params.social]
    twitter = "MarekDlugos"

  # Inputs to the marek-ds theme. Theme templates read only this table (plus
  # description and images, which Hugo's own embedded templates also read).
  [params.ds]
    author = "Marek Dlugos"

    [params.ds.newsletter]
      action = "https://app.kit.com/forms/7335918/subscriptions"
      heading = "Occasional updates delivered to your inbox 📩"
      copy = "Join over 200 people receiving updates from my life and what I am currently up to."

[services]
  [services.googleAnalytics]
    ID = "G-36B0M4RPHF"

[privacy]
  [privacy.googleAnalytics]
    # Matches the behaviour of the hand-written snippet this replaces.
    respectDoNotTrack = false

# Tailwind v4 pipeline. Hugo writes the rendered class inventory to
# hugo_stats.json; the theme's main.css sources it and Tailwind emits only the
# utilities that actually appear in the built HTML.
[build]
  [build.buildStats]
    enable = true

  # Rebuild CSS in `hugo server` when the class inventory changes.
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'

  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"

  # Mounted out of the watched tree so regenerating it does not trigger a rebuild loop.
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"
    disableWatch = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Owner-authored content; needed so shortcodes can pass rendered HTML
      # through .Inner and Markdown may carry the odd inline element.
      unsafe = true
    [markup.goldmark.parser]
      # A standalone image line becomes a block, so the image render hook can
      # wrap it in <figure>.
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.renderHooks.image]
      # The theme ships its own render-image.html.
      useEmbedded = "never"

[security]
  # Allow .html files in content/ (Hugo 0.163+ blocks text/html content by
  # default). Removed once every content page is Markdown (end of Phase 2).
  allowContent = ['.']

  [security.exec]
    # Setting this replaces Hugo's default list, so the defaults are repeated.
    # css.TailwindCSS launches the Tailwind CLI through node; tailwindcss itself
    # leaves Hugo's default list in 0.165, so both are listed explicitly.
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^node$', '^tailwindcss$']
